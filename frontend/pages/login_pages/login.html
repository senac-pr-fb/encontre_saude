<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontre Saúde - Login</title>
    <!-- Adicionando fontes inter/roboto padrão do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./login.css">
    <script type="module" src="./login.js" defer></script>
</head>

<body>
    <button id="btnBackHome" class="btn-back-home" title="Voltar para a página inicial">
        <i class="fas fa-arrow-left"></i> Voltar
    </button>

    <main class="login-main">
        <div class="login-card-container">
            <div class="login-card">

                <!-- FACE DE LOGIN -->
                <div class="form-face login-face">
                    <div class="brand">
                        <img src="../../assets/logoTipo.png" alt="Encontre Saúde Logo" class="login-logo">
                        <h2>Fazer login</h2>
                        <p>Use sua conta Encontre Saúde</p>
                    </div>

                    <form id="loginForm" class="g-form">
                        <div class="input-group">
                            <input type="email" id="email" required placeholder=" ">
                            <label for="email">E-mail</label>
                        </div>


                        <div class="input-group">
                            <input type="password" id="password" required placeholder=" " class="input-com-toggle">
                            <label for="password">Senha</label>
                            <button type="button" class="btn-toggle-senha" data-target="password" title="Mostrar senha">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>


                        <div class="forgot-password-container">
                            <button type="button" class="btn-forgot-password">Esqueceu a senha?</button>
                        </div>

                        <div class="actions">
                            <button type="button" class="btn-text" id="btnGoToRegister">Criar conta</button>
                            <button type="submit" class="btn-primary">Avançar</button>
                        </div>

                        <div class="divider">
                            <span>ou</span>
                        </div>
                        <button type="button" class="btn-google" id="btnGoogleLogin">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" class="google-icon"> Continuar com o Google
                        </button>
                    </form>
                </div>

                <!-- FACE DE CADASTRO -->
                <div class="form-face register-face hidden">
                    <div class="brand">
                        <img src="../../assets/logoTipo.png" alt="Encontre Saúde Logo" class="login-logo">
                        <h2>Criar conta</h2>
                        <p>Junte-se ao Encontre Saúde</p>
                    </div>

                    <form id="registerForm" class="g-form">
                        <div class="input-group">
                            <input type="text" id="regName" required placeholder=" ">
                            <label for="regName">Nome completo</label>
                        </div>
                        <div class="input-group">
                            <input type="email" id="regEmail" required placeholder=" ">
                            <label for="regEmail">E-mail</label>
                        </div>
                        <div class="input-group">
                            <input type="password" id="regPassword" required placeholder=" " class="input-com-toggle">
                            <label for="regPassword">Senha</label>
                            <button type="button" class="btn-toggle-senha" data-target="regPassword" title="Mostrar senha">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>

                        <div class="actions">
                            <button type="button" class="btn-text" id="btnGoToLogin">Faça login em vez disso</button>
                            <button type="submit" class="btn-primary">Cadastrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
