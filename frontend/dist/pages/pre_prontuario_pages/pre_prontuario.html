<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encontre Saúde — Pré-Prontuário Digital</title>
  <meta name="description"
    content="Preencha seu pré-prontuário digital e receba o documento pelo e-mail ou WhatsApp antes da consulta.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/assets/pre_prontuario-qCHbIskq.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/authService-FkTjPsGX.js">
  <link rel="modulepreload" crossorigin href="/assets/sidebar-BkaUTNX8.js">
  <link rel="modulepreload" crossorigin href="/assets/profileService-BVFTB378.js">
  <link rel="modulepreload" crossorigin href="/assets/chatService-C8Ne2wPU.js">
  <link rel="stylesheet" crossorigin href="/assets/pre_prontuario-CPV9123h.css">
</head>

<body>
  <header id="header"></header>

  <main class="pp-main">
    <div class="pp-container">

      <!-- Cabeçalho compacto -->
      <div class="pp-page-header">
        <div class="pp-page-title">
          <i class="fas fa-file-medical"></i>
          <div>
            <h1>Pré-Prontuário Digital</h1>
            <p>Preencha e receba o documento por e-mail ou WhatsApp.</p>
          </div>
        </div>

        <!-- Barra de Progresso -->
        <div class="pp-progress-bar">
          <div class="pp-step active" id="progress-step-1">
            <div class="pp-step-circle"><i class="fas fa-user"></i></div>
            <span>Dados</span>
          </div>
          <div class="pp-step-line" id="line-1-2"></div>
          <div class="pp-step" id="progress-step-2">
            <div class="pp-step-circle"><i class="fas fa-stethoscope"></i></div>
            <span>Sintomas</span>
          </div>
          <div class="pp-step-line" id="line-2-3"></div>
          <div class="pp-step" id="progress-step-3">
            <div class="pp-step-circle"><i class="fas fa-notes-medical"></i></div>
            <span>Histórico</span>
          </div>
          <div class="pp-step-line" id="line-3-4"></div>
          <div class="pp-step" id="progress-step-4">
            <div class="pp-step-circle"><i class="fas fa-paper-plane"></i></div>
            <span>Envio</span>
          </div>
        </div>
      </div>

      <div class="pp-content">
        <!-- Formulário -->
        <form id="pp-form" novalidate>

          <!-- ─── STEP 1: DADOS PESSOAIS ─────────────────────────────── -->
          <div class="pp-card pp-step-panel active" id="step-1">
            <h2 class="pp-section-title"><i class="fas fa-user-circle"></i> Dados Pessoais</h2>

            <div class="pp-grid-2">
              <div class="pp-field">
                <label for="nome">Nome Completo <span class="required">*</span></label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva Santos" autocomplete="name"
                  required>
                <span class="pp-error" id="erro-nome"></span>
              </div>
              <div class="pp-field">
                <label for="dataNascimento">Data de Nascimento <span class="required">*</span></label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>
                <span class="pp-error" id="erro-dataNascimento"></span>
              </div>
            </div>

            <div class="pp-grid-3">
              <div class="pp-field">
                <label for="cpf">CPF <span class="required">*</span></label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" autocomplete="off"
                  required>
                <span class="pp-error" id="erro-cpf"></span>
              </div>
              <div class="pp-field">
                <label for="sexo">Sexo Biológico <span class="required">*</span></label>
                <select id="sexo" name="sexo" required>
                  <option value="">Selecione...</option>
                  <option value="Masculino">Masculino</option>
                  <option value="Feminino">Feminino</option>
                  <option value="Outro">Outro</option>
                </select>
                <span class="pp-error" id="erro-sexo"></span>
              </div>
              <div class="pp-field">
                <label for="telefone">Telefone <span class="required">*</span></label>
                <input type="tel" id="telefone" name="telefone" placeholder="(46) 99999-9999" maxlength="15"
                  autocomplete="tel" required>
                <span class="pp-error" id="erro-telefone"></span>
              </div>
            </div>
          </div>

          <!-- ─── STEP 2: SINTOMAS ───────────────────────────────────── -->
          <div class="pp-card pp-step-panel" id="step-2">
            <h2 class="pp-section-title"><i class="fas fa-stethoscope"></i> Sintomas</h2>

            <div class="pp-grid-2">
              <div class="pp-field">
                <label for="queixaPrincipal">Queixa Principal <span class="required">*</span></label>
                <textarea id="queixaPrincipal" name="queixaPrincipal" rows="3"
                  placeholder="Descreva o principal motivo da consulta..." required></textarea>
                <span class="pp-error" id="erro-queixaPrincipal"></span>
              </div>
              <div class="pp-field">
                <label for="tempoPrincipalSintoma">Duração do Sintoma (OPICIONAL)</label>
                <input type="text" id="tempoPrincipalSintoma" name="tempoPrincipalSintoma"
                  placeholder="Ex: 3 dias, 1 semana...">
              </div>
            </div>

            <div class="pp-field">
              <label>Sintomas Presentes <small>(marque todos que se aplicam)</small></label>
              <div class="pp-checkboxes">
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Febre"> <i
                    class="fas fa-thermometer-half"></i> Febre</label>
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Dor de Cabeça"> <i
                    class="fas fa-head-side-virus"></i> Dor de Cabeça</label>
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Tosse"> <i
                    class="fas fa-lungs-virus"></i> Tosse</label>
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Falta de Ar"> <i
                    class="fas fa-wind"></i> Falta de Ar</label>
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Dor no Peito"> <i
                    class="fas fa-heart-crack"></i> Dor no Peito</label>
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Náusea/Vômito"> <i
                    class="fas fa-face-dizzy"></i> Náusea/Vômito</label>
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Diarreia"> <i
                    class="fas fa-toilet"></i> Diarreia</label>
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Dor Abdominal"> <i
                    class="fas fa-circle-dot"></i> Dor Abdominal</label>
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Dor nas Costas"> <i
                    class="fas fa-person-sitting"></i> Dor nas Costas</label>
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Tontura"> <i
                    class="fas fa-arrows-spin"></i> Tontura</label>
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Fraqueza/Cansaço"> <i
                    class="fas fa-battery-quarter"></i> Fraqueza</label>
                <label class="pp-checkbox-item"><input type="checkbox" name="sintomas" value="Coriza"> <i
                    class="fas fa-head-side-cough"></i> Coriza</label>
              </div>
            </div>
          </div>

          <!-- ─── STEP 3: HISTÓRICO + SINAIS VITAIS ─────────────────── -->
          <div class="pp-card pp-step-panel" id="step-3">
            <h2 class="pp-section-title"><i class="fas fa-notes-medical"></i> Histórico Clínico</h2>

            <div class="pp-grid-2 pp-compact">
              <div class="pp-field">
                <label for="alergias"><i class="fas fa-triangle-exclamation"></i> Alergias</label>
                <input type="text" id="alergias" name="alergias" placeholder="Ex: Dipirona, amoxicilina...">
              </div>
              <div class="pp-field">
                <label for="medicamentosEmUso"><i class="fas fa-pills"></i> Medicamentos em Uso</label>
                <input type="text" id="medicamentosEmUso" name="medicamentosEmUso" placeholder="Ex: Losartana 50mg...">
              </div>
            </div>

            <div class="pp-grid-2 pp-compact">
              <div class="pp-field">
                <label for="doencasPreexistentes"><i class="fas fa-clipboard-list"></i> Doenças Preexistentes</label>
                <input type="text" id="doencasPreexistentes" name="doencasPreexistentes"
                  placeholder="Ex: Hipertensão, Diabetes...">
              </div>
              <div class="pp-field">
                <label for="historicoFamiliar"><i class="fas fa-people-roof"></i> Histórico Familiar</label>
                <input type="text" id="historicoFamiliar" name="historicoFamiliar" placeholder="Ex: Pai com infarto...">
              </div>
            </div>

            <!-- Sinais Vitais compactos -->
            <div class="pp-vitais-card">
              <p class="pp-vitais-title"><i class="fas fa-heartbeat"></i> Sinais Vitais <small>— opcional</small></p>
              <div class="pp-grid-3">
                <div class="pp-field">
                  <label for="pressaoArterial"><i class="fas fa-gauge"></i> Pressão</label>
                  <input type="text" id="pressaoArterial" name="pressaoArterial" placeholder="Ex: 120/80 mmHg">
                </div>
                <div class="pp-field">
                  <label for="frequenciaCardiaca"><i class="fas fa-heart"></i> Freq. Cardíaca</label>
                  <input type="number" id="frequenciaCardiaca" name="frequenciaCardiaca" placeholder="bpm" min="0" max="300">
                </div>
                <div class="pp-field">
                  <label for="temperatura"><i class="fas fa-thermometer"></i> Temperatura</label>
                  <input type="number" id="temperatura" name="temperatura" placeholder="°C" step="0.1" min="30" max="45">
                </div>
                <div class="pp-field">
                  <label for="saturacaoOxigenio"><i class="fas fa-lungs"></i> Saturação O₂</label>
                  <input type="number" id="saturacaoOxigenio" name="saturacaoOxigenio" placeholder="%" min="0" max="100">
                </div>
                <div class="pp-field">
                  <label for="peso"><i class="fas fa-weight-scale"></i> Peso (kg)</label>
                  <input type="number" id="peso" name="peso" placeholder="kg" step="0.1" min="0" max="300">
                </div>
                <div class="pp-field">
                  <label for="altura"><i class="fas fa-ruler-vertical"></i> Altura (cm)</label>
                  <input type="number" id="altura" name="altura" placeholder="cm" min="0" max="300">
                </div>
              </div>
            </div>

            <div class="pp-field pp-compact">
              <label for="observacoesAdicionais"><i class="fas fa-comment-medical"></i> Observações Adicionais</label>
              <textarea id="observacoesAdicionais" name="observacoesAdicionais" rows="2"
                placeholder="Qualquer informação adicional relevante..."></textarea>
            </div>
          </div>

          <!-- ─── STEP 4: CANAL DE ENVIO ─────────────────────────────── -->
          <div class="pp-card pp-step-panel" id="step-4">
            <h2 class="pp-section-title"><i class="fas fa-paper-plane"></i> Como deseja receber o documento?</h2>

            <!-- <div class="pp-canal-selector">
            <label class="pp-canal-option">
              <input type="radio" name="canalEnvio" id="canal-email" value="email">
              <div class="pp-canal-card">
                <i class="fas fa-envelope"></i>
                <strong>E-mail</strong>
                <span>Receba o PDF na sua caixa de entrada</span>
              </div>
            </label>
            <label class="pp-canal-option">
              <input type="radio" name="canalEnvio" id="canal-whatsapp" value="whatsapp">
              <div class="pp-canal-card">
                <i class="fab fa-whatsapp"></i>
                <strong>WhatsApp</strong>
                <span>Receba o PDF direto no aplicativo</span>
              </div>
            </label>
          </div>
          <span class="pp-error" id="erro-canalEnvio"></span>

          <div class="pp-field pp-field-destino" id="campo-email" style="display:none;">
            <label for="email">Endereço de E-mail <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email">
            <span class="pp-error" id="erro-email"></span>
          </div>

          <div class="pp-field pp-field-destino" id="campo-whatsapp" style="display:none;">
            <label for="whatsapp">Número do WhatsApp <span class="required">*</span></label>
            <input type="tel" id="whatsapp" name="whatsapp" placeholder="+55 (46) 99999-9999">
            <p class="pp-hint-small">Inclua o código do país: +55 para Brasil</p>
            <span class="pp-error" id="erro-whatsapp"></span>
          </div> -->

            <!-- Resumo -->
            <div class="pp-resumo-box">
              <p class="pp-resumo-title"><i class="fas fa-list-check"></i> Resumo</p>
              <div class="pp-resumo-content" id="resumo-content"></div>
            </div>

            <div class="pp-btn-group">
              <button type="button" class="pp-btn-download" id="btn-download">
                <i class="fas fa-download"></i> Baixar PDF
              </button>
            </div>
          </div>

        </form>

        <!-- Navegação -->
        <div class="pp-navigation">
          <button type="button" class="pp-btn-outline" id="btn-back" style="visibility:hidden;">
            <i class="fas fa-arrow-left"></i> Voltar
          </button>
          <button type="button" class="pp-btn" id="btn-next">
            Próximo <i class="fas fa-arrow-right"></i>
          </button>
        </div><!-- /.pp-navigation -->

      </div><!-- /.pp-content -->

    </div><!-- /.pp-container -->
  </main>

  <!-- Toast -->
  <div class="pp-toast" id="pp-toast" role="alert">
    <div class="pp-toast-icon" id="toast-icon"></div>
    <div class="pp-toast-msg" id="toast-msg"></div>
  </div>

</body>

</html>
