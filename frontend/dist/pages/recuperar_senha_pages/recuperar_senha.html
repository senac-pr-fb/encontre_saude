<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontre Saúde - Recuperar Senha</title>
    <!-- Adicionando fontes inter/roboto padrão do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Usando a folha de estilos limpa de recuperação -->
  <script type="module" crossorigin src="/assets/recuperar_senha-CamfKfEm.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/authService-FkTjPsGX.js">
  <link rel="stylesheet" crossorigin href="/assets/recuperar_senha-N30kM9cc.css">
</head>
<body>
    <button id="btnBackLogin" class="btn-back-home" title="Voltar para a página inicial">
        <i class="fas fa-arrow-left"></i> Interromper e Voltar
    </button>

    <main class="login-main">
        <div class="login-card-container">
            <div class="login-card">
                
                <!-- FACE 1: SOLICITAÇÃO (Supabase Magic Link) -->
                <div class="form-face" id="faceEmail">
                    <div class="brand">
                        <img src="../../assets/logoTipo.png" alt="Encontre Saúde Logo" class="login-logo">
                        <h2>Esqueceu a senha?</h2>
                        <p>Insira seu E-mail para receber um link de acesso</p>
                    </div>

                    <form id="emailForm" class="g-form">
                        <div class="input-group">
                            <input type="email" id="recoveryEmail" required placeholder=" ">
                            <label for="recoveryEmail">Seu E-mail cadastrado</label>
                        </div>

                        <div class="actions center-actions">
                            <button type="submit" class="btn-primary w-100">Enviar e-mail para Redefinir</button>
                        </div>
                    </form>
                </div>

                <!-- FACE 2: NOVA SENHA (MUITO MAIS ÁGIL) -->
                <div class="form-face hidden" id="faceNovaSenha">
                    <div class="brand">
                        <i class="fas fa-shield-alt" style="font-size: 48px; color: #0b57d0; margin-bottom:16px;"></i>
                        <h2>Criar Nova Senha</h2>
                        <p>Seja bem-vindo de volta, redefina suas credenciais.</p>
                    </div>

                    <form id="novaSenhaForm" class="g-form">
                        <div class="input-group">
                            <input type="password" id="newPassword" required placeholder=" " class="input-com-toggle">
                            <label for="newPassword">Criar nova senha</label>
                            <button type="button" class="btn-toggle-senha" data-target="newPassword" title="Mostrar senha">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="input-group">
                            <input type="password" id="confirmNewPassword" required placeholder=" " class="input-com-toggle">
                            <label for="confirmNewPassword">Confirme a senha</label>
                            <button type="button" class="btn-toggle-senha" data-target="confirmNewPassword" title="Mostrar senha">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>

                        <div class="actions center-actions">
                            <button type="submit" class="btn-primary w-100">Modificar Senha e Acessar</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
